services:
  caddy:
    image: caddy:alpine@sha256:f2a1290d0463aad60660d4ec134943f183ee2a5f6c3eb7bf32dd984f2f020772
    restart: always
    container_name: caddy
    volumes:
      - caddy_certs:/certs
      - caddy_config:/config
      - caddy_data:/data
      - caddy_sites:/srv
    network_mode: "host"
    configs:
      - source: Caddyfile
        target: /etc/caddy/Caddyfile
configs:
  Caddyfile:
    content: |
      (private_ui) {
        @outside not remote_ip private_ranges
        respond @outside "Private network access only" 403
      }

      https://${DOMAIN_NAME:?Set DOMAIN_NAME in the root .env}:443 {
        tls internal
        reverse_proxy localhost:11000
      }

      https://pihole.${DOMAIN_NAME}:443 {
        tls internal
        route {
          import private_ui
          redir / /admin/ 302
          reverse_proxy 127.0.0.1:${PIHOLE_UI_PORT:?Set PIHOLE_UI_PORT in the root .env}
        }
      }

      https://wg.${DOMAIN_NAME}:443 {
        tls internal
        route {
          import private_ui
          reverse_proxy 127.0.0.1:${WG_UI_PORT:?Set WG_UI_PORT in the root .env}
        }
      }

volumes:
  caddy_certs:
  caddy_config:
  caddy_data:
  caddy_sites:
