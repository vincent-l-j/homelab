volumes:
  etc_wireguard:
  etc_pihole:

services:
  wg-easy:
    environment:
      INSECURE: "${WG_EASY_INSECURE:-true}"
    # image: ghcr.io/wg-easy/wg-easy:15
    build: .
    container_name: wg-easy
    networks:
      wg:
        ipv4_address: "${WG_CONTAINER_IP}"
        ipv6_address: "${WG_CONTAINER_IPV6}"
    volumes:
      - etc_wireguard:/etc/wireguard
      - /lib/modules:/lib/modules:ro
    ports:
      - "51820:51820/udp"
      - "51821:51821/tcp"
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv6.conf.all.disable_ipv6=0
      - net.ipv6.conf.all.forwarding=1
      - net.ipv6.conf.default.forwarding=1

  pihole:
    image: pihole/pihole:latest
    container_name: pihole
    environment:
      TZ: "${TZ}"
      FTLCONF_webserver_api_password: "${PIHOLE_PASSWORD:?Set PIHOLE_PASSWORD in .env}"
      FTLCONF_dns_listeningMode: "ALL"
    networks:
      wg:
        ipv4_address: "${PIHOLE_IP}"
    volumes:
      - etc_pihole:/etc/pihole
    ports:
      - "${PIHOLE_UI_PORT:-5353}:80/tcp"
    restart: unless-stopped

networks:
  wg:
    driver: bridge
    enable_ipv6: true
    ipam:
      driver: default
      config:
        - subnet: "${DOCKER_SUBNET}"
        - subnet: "${DOCKER_IPV6_SUBNET}"
